<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riya Bakes | Scrumptybies</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@700;800&family=Caveat:wght@700&family=Sacramento&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-pink: #ff2a6d;
            --neon-blue: #05d9e8;
            --neon-purple: #d1f7ff;
            --dark-bg: #0d0221;
            --light-bg: #f8f9fa;
            --card-bg-light: rgba(255, 255, 255, 0.8);
            --card-bg-dark: rgba(13, 2, 33, 0.8);
            --text-dark: #0d0221;
            --text-light: #ffffff;
            --gradient-main: linear-gradient(135deg, var(--neon-pink), var(--neon-blue));
            --font-heading: 'Syne', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
            --font-hand: 'Caveat', cursive;
            --font-logo: 'Sacramento', cursive;
        }

        body.dark-mode {
            --light-bg: #0d0221;
            --text-dark: #ffffff;
            --card-bg-light: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
            transition: background-color 0.4s, color 0.4s;
            overflow-x: hidden;
        }

        .page {
            display: none;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        body.dark-mode nav {
            background: rgba(13, 2, 33, 0.7);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav-logo {
            font-family: var(--font-logo);
            font-size: 2rem;
            color: var(--text-light);
            text-shadow: 0 0 10px var(--neon-blue);
            cursor: pointer;
        }

        body.dark-mode .nav-logo {
             color: var(--text-light);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
            cursor: pointer;
        }

        body.dark-mode nav a {
            color: var(--text-light);
        }

        nav a:hover, nav a.active {
            color: var(--neon-pink);
            text-shadow: 0 0 8px rgba(255, 42, 109, 0.5);
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--text-dark);
            color: var(--text-dark);
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        body.dark-mode .theme-toggle {
            border-color: var(--text-light);
            color: var(--text-light);
        }

        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: var(--gradient-main);
            padding: 10px 0;
            margin-top: 70px;
            white-space: nowrap;
        }

        .ticker {
            display: inline-block;
            animation: ticker 20s linear infinite;
            font-family: var(--font-heading);
            font-weight: 800;
            text-transform: uppercase;
            color: #fff;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        header {
            background: var(--gradient-main);
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--text-light);
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--neon-purple);
            border-radius: 50%;
            filter: blur(100px);
            top: -100px;
            left: -100px;
            opacity: 0.6;
        }
        header::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--neon-blue);
            border-radius: 50%;
            filter: blur(100px);
            bottom: -50px;
            right: -50px;
            opacity: 0.6;
        }

        .hero-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            max-width: 1100px;
            width: 100%;
            flex-wrap: wrap;
            z-index: 1;
        }

        .hero-text {
            flex: 1;
            min-width: 300px;
            text-align: right;
        }

        .hero-text h1 {
            font-family: var(--font-heading);
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .hero-text h1 span {
            font-family: var(--font-hand);
            font-size: 5rem;
            color: var(--neon-blue);
            text-transform: none;
            display: block;
            line-height: 0.8;
            margin-bottom: 10px;
        }

        .hero-image {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            width: 550px;
            max-width: 100%;
            height: auto;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transition: transform 0.4s;
            border: 4px solid rgba(255,255,255,0.2);
        }

        .hero-image img:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .section-container {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient-main);
            border-radius: 2px;
        }

        .about-section {
            background: var(--card-bg-light);
            backdrop-filter: blur(10px);
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 50px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.3);
            margin-top: -60px;
            position: relative;
            z-index: 10;
        }

        body.dark-mode .about-section {
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .about-text {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }

        .about-text h2 {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--neon-pink);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .about-text p {
            margin-bottom: 15px;
            font-size: 1rem;
            color: var(--text-dark);
            opacity: 0.9;
        }

        .about-text ul {
            list-style: none;
            margin-top: 25px;
        }

        .about-text li {
            margin-bottom: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.05rem;
        }

        .about-text li span {
            font-size: 1.5rem;
        }

        .about-image {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
        }

        .about-image img {
            max-width: 350px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg-light);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
        }

        body.dark-mode .card {
             border: 1px solid rgba(255,255,255,0.1);
             box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(255, 42, 109, 0.15);
            border-color: var(--neon-pink);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 25px;
            text-align: center;
        }

        .card-content h3 {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .price {
            font-weight: 800;
            color: var(--neon-blue);
            margin-bottom: 15px;
            font-size: 1.2rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.5;
        }

        .testimonial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .testimonial-card {
            background: var(--card-bg-light);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 2px dashed rgba(255, 42, 109, 0.3);
            transition: all 0.3s;
        }

        body.dark-mode .testimonial-card {
            border: 2px dashed rgba(5, 217, 232, 0.3);
        }

        .testimonial-card:hover {
            border-style: solid;
            border-color: var(--neon-pink);
            transform: rotate(1deg);
        }

        .testimonial-card img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            display: block;
        }

        .testimonial-text {
            font-style: italic;
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .testimonial-date {
            font-family: var(--font-heading);
            color: var(--neon-pink);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            background: var(--card-bg-light);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        body.dark-mode .contact-wrapper {
            border: 1px solid rgba(255,255,255,0.1);
        }

        .contact-info {
            flex: 1;
            min-width: 300px;
        }

        .contact-info h2 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--neon-pink);
            text-transform: uppercase;
        }

        .contact-btn {
            display: inline-block;
            background: var(--gradient-main);
            color: #fff;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 800;
            font-family: var(--font-heading);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 42, 109, 0.4);
        }

        .contact-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 42, 109, 0.6);
        }

        .map-container {
            flex: 1;
            min-width: 300px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 3px solid var(--neon-blue);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            min-height: 350px;
            border: 0;
            filter: grayscale(20%) contrast(1.1);
        }

        body.dark-mode .map-container iframe {
            filter: invert(90%) hue-rotate(180deg) grayscale(20%);
        }

        footer {
            text-align: center;
            padding: 30px;
            background: var(--dark-bg);
            color: #fff;
            font-family: var(--font-heading);
            letter-spacing: 1px;
            font-size: 0.9rem;
            margin-top: 50px;
        }

        @media (max-width: 900px) {
            .hero-text { text-align: center; }
            .hero-text h1 { font-size: 3rem; }
            .hero-text h1 span { font-size: 4rem; }
            .about-section { padding: 30px; margin-top: 0; border-radius: 0; }
            nav { padding: 15px 20px; flex-direction: column; gap: 15px; }
            nav ul { flex-wrap: wrap; justify-content: center; }
            .ticker-wrap { margin-top: 120px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo" id="nav-logo"></div>
        <ul id="nav-menu">
            <li><button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button></li>
        </ul>
    </nav>

    <div class="ticker-wrap">
        <div class="ticker" id="ticker-content"></div>
    </div>

    <!-- HOME PAGE -->
    <div id="page-home" class="page active">
        <header>
            <div class="hero-content">
                <div class="hero-text">
                    <h1><span id="hero-title-top"></span> <span id="hero-title-main"></span></h1>

        </header>
        <section class="section-container">
            <div class="about-section">
                <div class="about-text">
                    <h2 id="about-title"></h2>

                    <p id="about-p2"></p>
                    <ul id="about-highlights"></ul>
                </div>
                <div class="about-image">
                    <img id="about-image" src="" alt="Avatar">
                </div>
            </div>
        </section>
    </div>

    <!-- MENU PAGE -->
    <div id="page-menu" class="page">
        <section class="section-container" id="menu-container"></section>
    </div>

    <!-- TESTIMONIALS PAGE -->
    <div id="page-testimonials" class="page">
        <section class="section-container">
            <h2 class="section-title">The Reviews Are In</h2>
            <div class="testimonial-grid" id="testimonial-container"></div>
        </section>
    </div>

    <!-- CONTACT PAGE -->
    <div id="page-contact" class="page">
        <section class="section-container">
            <div class="contact-wrapper">
                <div class="contact-info">
                    <h2 id="contact-title"></h2>
                    <p id="contact-text"></p>
                    <ul style="list-style: none; font-weight: 700; margin-top: 20px;" id="contact-methods"></ul>
                    <a href="#" class="contact-btn" id="contact-btn"></a>
                </div>
                <div class="map-container">
                    <iframe id="contact-map" src="" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> Riya Bakes (Scrumptybies). All rights reserved.</p>
    </footer>

        // --- RENDER FUNCTIONS ---
        function renderSite() {
            document.title = SITE_CONTENT.siteTitle;
            document.getElementById('year').innerText = new Date().getFullYear();

            document.getElementById('nav-logo').innerText = SITE_CONTENT.logoText;
            const navMenu = document.getElementById('nav-menu');
            navMenu.innerHTML = '';
            SITE_CONTENT.navLinks.forEach(link => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.innerText = link.text;
                a.className = 'nav-link';
                a.id = 'nav-' + link.page;
                a.onclick = () => showPage(link.page);
                li.appendChild(a);
                navMenu.appendChild(li);
            });
            const themeLi = document.createElement('li');
            themeLi.innerHTML = '<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>';
            navMenu.appendChild(themeLi);
            document.getElementById('nav-home').classList.add('active');

            document.getElementById('ticker-content').innerText = SITE_CONTENT.tickerText + SITE_CONTENT.tickerText;

            document.getElementById('hero-title-top').innerText = SITE_CONTENT.hero.titleTop;
            document.getElementById('hero-title-main').innerText = SITE_CONTENT.hero.titleMain;
            document.getElementById('hero-image').src = SITE_CONTENT.hero.image;

            document.getElementById('about-title').innerText = SITE_CONTENT.about.title;
            document.getElementById('about-p1').innerText = SITE_CONTENT.about.paragraph1;
            document.getElementById('about-p2').innerText = SITE_CONTENT.about.paragraph2;
            document.getElementById('about-image').src = SITE_CONTENT.about.image;

            const highlightsList = document.getElementById('about-highlights');
            highlightsList.innerHTML = '';
            SITE_CONTENT.about.highlights.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${item.icon}</span> ${item.text}`;
                highlightsList.appendChild(li);
            });

            const menuContainer = document.getElementById('menu-container');
            menuContainer.innerHTML = '';
            SITE_CONTENT.menuSections.forEach((section) => {
                const sectionTitle = document.createElement('h2');
                sectionTitle.className = 'section-title';
                sectionTitle.innerText = section.title;
                menuContainer.appendChild(sectionTitle);

                const grid = document.createElement('div');
                grid.className = 'grid-layout';
                grid.style.marginBottom = '80px';

                section.items.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    if (section.items.length === 1 && section.title === "Nutella Tarts") {
                        card.style.gridColumn = "1 / -1";
                        card.style.maxWidth = "800px";
                        card.style.margin = "0 auto";
                    }
                    card.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <div class="card-content">
                            <h3>${item.name}</h3>
                            ${item.price ? `<p class="price">${item.price}</p>` : ''}
                            <p class="description">${item.description}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                menuContainer.appendChild(grid);
            });

            const testimonialContainer = document.getElementById('testimonial-container');
            testimonialContainer.innerHTML = '';
            SITE_CONTENT.testimonials.forEach((test) => {
                const card = document.createElement('div');
                card.className = 'testimonial-card';
                card.innerHTML = `
                    <img src="${test.image}" alt="Review">
                    <p class="testimonial-date">${test.date}</p>
                    <p class="testimonial-text">${test.text}</p>
                `;
                testimonialContainer.appendChild(card);
            });

            document.getElementById('contact-title').innerText = SITE_CONTENT.contact.title;
            document.getElementById('contact-text').innerText = SITE_CONTENT.contact.text;
            const methodsList = document.getElementById('contact-methods');
            methodsList.innerHTML = '';
            SITE_CONTENT.contact.methods.forEach(method => {
                const li = document.createElement('li');
                li.style.marginBottom = '10px';
                li.innerHTML = `${method.label} <a href="${method.link}" style="color: var(--neon-pink); text-decoration: none;">${method.value}</a>`;
                methodsList.appendChild(li);
            });
            const contactBtn = document.getElementById('contact-btn');
            contactBtn.innerText = SITE_CONTENT.contact.buttonText;
            contactBtn.href = SITE_CONTENT.contact.buttonLink;
            document.getElementById('contact-map').src = SITE_CONTENT.contact.mapEmbedUrl;

            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-btn').innerText = '☀️';
            }
        }

        function showPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            const selectedPage = document.getElementById('page-' + pageId);
            if (selectedPage) selectedPage.classList.add('active');
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => link.classList.remove('active'));
            const activeNav = document.getElementById('nav-' + pageId);
            if (activeNav) activeNav.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('theme-btn');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                themeBtn.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                themeBtn.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderSite();
        });
    </script>

</body>
</html>
